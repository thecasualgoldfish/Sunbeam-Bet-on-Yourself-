<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blinking Input</title>
  <style>
    body {
      display: grid;
      place-items: center;
      height: 100vh;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
    }

    .blink-input {
      width: 280px;
      padding: 12px 14px;
      font-size: 18px;
      border: 2px solid #4f46e5;
      border-radius: 10px;
      outline: none;
      background: white;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
      animation: blinkBorder 1s ease-in-out infinite alternate;
    }

    .blink-input:focus {
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
      transform: translateY(-1px);
    }

    @keyframes blinkBorder {
      0% {
        border-color: #4f46e5;
        box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.25);
      }
      50% {
        border-color: #8b5cf6;
        box-shadow: 0 0 0 6px rgba(139, 92, 246, 0.12);
      }
      100% {
        border-color: #a78bfa;
        box-shadow: 0 0 0 0 rgba(167, 139, 250, 0.25);
      }
    }
  </style>
</head>
<body>
  <input class="blink-input" type="text" placeholder="Type here..." />

  <script>
    const input = document.querySelector(".blink-input");

    input.addEventListener("input", () => {
      console.log("Value:", input.value);
    });
  </script>
</body>
</html>
