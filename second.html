<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Input Box</title>
</head>
<body>
  <div id="input-container">
    <input type="text" placeholder="I will...">
  </div>
  <button onclick="addInput()">What else will you do?</button>
  <div style="display: none;">
    <script>
        function addInput() {
        const container = document.getElementById('input-container');
        const newInput = document.createElement('input');
        newInput.type = 'text';
        newInput.placeholder = 'I will also...';
        container.appendChild(newInput);
        }
    </script>
  </div>
</body>
</html>
